name: Dev Release

# Builds a debug APK on every push and republishes it under a single
# rolling "dev" release (tag `dev`), so there's always one up-to-date
# development build instead of a growing list of releases.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        # ubuntu-latest runners already ship a full Android SDK at $ANDROID_HOME;
        # android-actions/setup-android fails trying to fetch the removed
        # legacy 'tools' package, so just accept licenses on the preinstalled one.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        # gradle.properties hardcodes a Linux org.gradle.java.home path for a
        # different distro layout; point it at the JDK setup-java just installed.
        run: ./gradlew :app:assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Collect APK
        run: |
          mkdir -p dist
          apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          cp "$apk" dist/sing-for-android-dev.apk

      - name: Publish rolling dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev build (latest)
          prerelease: true
          body: |
            Automated development build from commit ${{ github.sha }}.
            Rebuilt and replaced on every push to `main` — not a stable release.
          files: dist/sing-for-android-dev.apk
